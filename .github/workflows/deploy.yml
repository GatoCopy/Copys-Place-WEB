name: Deploy a Neocities
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: garuda-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bcomnes/deploy-to-neocities@v1
        with:
          api_token: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: '.'
          cleanup: false