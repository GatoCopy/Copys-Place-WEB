<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · Copy's Place</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header id="header"></header>

  <div class="page-title-section">
    <div class="pixel-cat">🐱</div>
    <h1 class="page-title">✉️ Contacto Directo</h1>
  </div>

  <section>
    <div class="container">
      <div class="contact-content">
        <p style="text-align:center; margin-bottom: 2rem;">¿Tienes una propuesta, sugerencia, necesitas ayuda o quieres colaborar? ¡Contáctame aquí!</p>

        <div class="contact-form-wrapper">
          <form id="contactForm" class="contact-form">
            <div class="form-group">
              <label for="contact-name">Tu Nombre:</label>
              <input type="text" id="contact-name" name="name" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
              <label for="contact-email">Email:</label>
              <input type="email" id="contact-email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
              <label for="contact-subject">Asunto:</label>
              <select id="contact-subject" name="subject" required>
                <option value="">Selecciona un asunto</option>
                <option value="colaboracion">Colaboración</option>
                <option value="sugerencia">Sugerencia</option>
                <option value="ayuda">Necesito Ayuda</option>
                <option value="feedback">Feedback</option>
                <option value="otro">Otro</option>
              </select>
            </div>

            <div class="form-group">
              <label for="contact-message">Mensaje:</label>
              <textarea id="contact-message" name="message" placeholder="Cuéntame qué tienes en mente..." rows="6" required></textarea>
            </div>

            <button type="submit" class="submit-btn contact-submit">Enviar Contacto</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <footer id="footer"></footer>
  <div id="menu-root"></div>

  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
