<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todas las novedades · Copy's Place V3</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/palettes.css">
  <script>
    (function () {
      var r = document.documentElement, t = null, m = null, s = null;
      try { t = localStorage.getItem('cp-theme'); m = localStorage.getItem('cp-mpal'); s = localStorage.getItem('cp-skin'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      r.dataset.theme = t; r.dataset.skin = s === 'classic' ? 'classic' : 'modern';
      if (/^(naranja|violeta|menta|rosa|cielo)$/.test(m || '')) r.dataset.mpal = m;
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--surface); color: var(--on-surface); font: 400 1rem/1.6 var(--font-body); }
    .wrap { width: min(760px, 100% - 32px); margin: 0 auto; padding: 24px 0 72px; }
    .top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: var(--secondary-container); color: var(--on-secondary-container); text-decoration: none; font-weight: 500; }
    h1 { font: 700 clamp(1.8rem, 6vw, 2.6rem)/1.15 var(--font-display); margin: 20px 0 4px; }
    .lead { color: var(--on-surface-variant); margin: 0 0 12px; }
    #q { width: 100%; min-height: 48px; padding: 0 18px; margin: 12px 0 8px; border: 1px solid var(--outline); border-radius: 999px; background: var(--surface-container-low); color: var(--on-surface); font: inherit; }
    h2 { font: 600 .85rem/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--primary); margin: 32px 0 12px; }
    article { padding: 18px 20px; margin-bottom: 12px; border-radius: 20px; background: var(--surface-container); }
    article h3 { margin: 0 0 4px; font: 600 1.1rem/1.3 var(--font-display); }
    article p { margin: 0; color: var(--on-surface-variant); }
    .cat { display: inline-block; margin-bottom: 8px; padding: 2px 10px; border-radius: 999px; background: var(--primary-container); color: var(--on-primary-container); font-size: .78rem; font-weight: 500; }
    .none { color: var(--on-surface-variant); }
    html[data-skin="classic"] article, html[data-skin="classic"] .back, html[data-skin="classic"] #q, html[data-skin="classic"] .cat { border-radius: 0; border: 3px solid var(--px-line, #2a1a38); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><a class="back" href="/#novedades">← Volver a Copy's Place</a></div>
    <h1>Todas las novedades</h1>
    <p class="lead" id="count"></p>
    <input id="q" type="search" placeholder="Buscar en las novedades…" aria-label="Buscar en las novedades" autocomplete="off">
    <div id="list"></div>
    <p class="none" id="none" hidden>No encontré nada con eso.</p>
  </div>
  <script src="/data/content.js"></script>
  <script>
    (function () {
      var S = window.SITE || {}, ud = S.updates || {}, list = document.getElementById("list"), all = [];
      function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
      function label(k) { var s = String(k).replace(/-/g, " "); return s.charAt(0).toUpperCase() + s.slice(1); }
      Object.keys(ud).forEach(function (m) { (ud[m] || []).forEach(function (u) { all.push({ m: label(m), u: u }); }); });
      document.getElementById("count").textContent = all.length + " novedades, de la más nueva a la más antigua.";
      function paint(q) {
        q = (q || "").toLowerCase().trim(); var last = "", html = "", n = 0;
        all.forEach(function (it) {
          var hay = (it.u.title + " " + it.u.description + " " + (it.u.category || "")).toLowerCase();
          if (q && hay.indexOf(q) < 0) return;
          n++;
          if (it.m !== last) { html += "<h2>" + esc(it.m) + "</h2>"; last = it.m; }
          html += "<article><span class='cat'>" + esc(it.u.category || "Novedad") + "</span><h3>" + esc(it.u.title) + "</h3><p>" + esc(it.u.description) + "</p></article>";
        });
        list.innerHTML = html; document.getElementById("none").hidden = n > 0;
      }
      paint("");
      document.getElementById("q").addEventListener("input", function (e) { paint(e.target.value); });
    })();
  </script>
</body>
</html>
