    .ico { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-container); color: var(--on-primary-container); }

    .ico svg { width: 24px; height: 24px; }
    .t { flex: 1; min-width: 0; font-weight: 500; }
    .t small { display: block; font-weight: 400; font-size: .8rem; opacity: .8; }
    .out { width: 20px; height: 20px; opacity: .6; }
    .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 28px; color: var(--on-surface-variant); text-decoration: none; }
    .back:hover { color: var(--primary); }
    .back svg { width: 20px; height: 20px; }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } a.l { transition: none; } }
