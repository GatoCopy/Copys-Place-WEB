<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy's Place</title>

  <!-- ESTILOS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- ========== HEADER (se inyecta con js/layout.js) ========== -->
  <header id="header"></header>

  <!-- ========== HERO: TÍTULO + INTRODUCCIÓN ========== -->
  <section class="hero" id="inicio">
    <div class="hero-content">
      <div class="pixel-cat">🐱</div>
      <h1 class="hero-title">Copy's Place</h1>

      <div class="site-intro-box" id="site-intro-content">
        <!-- Se carga desde data/site-intro.json -->
      </div>
    </div>
  </section>

  <!-- ========== NOVEDAD DESTACADA ========== -->
  <div class="novedad-destacada" id="novedad-destacada">
    <!-- Se carga desde data/updates.json -->
  </div>

  <div class="divider">~ ★ ~</div>

  <!-- ========== CHAT / COMENTARIOS ========== -->
  <section id="comentarios">
    <div class="container">
      <h2>Chat & Comentarios</h2>

      <div class="comments-section">
        <div class="comments-display">
          <h3>💬 Canal de Chat</h3>
          <div id="commentsList">
            <!-- Se carga desde js/comments.js -->
          </div>
        </div>

        <div class="comment-form">
          <h3>Únete a la Conversación</h3>
          <form id="commentForm">
            <div class="form-group">
              <label for="name">Nombre:</label>
              <input type="text" id="name" name="name" placeholder="Tu nombre o alias" required>
            </div>
            <div class="form-group">
              <label for="comment">Mensaje:</label>
              <textarea id="comment" name="comment" placeholder="¿Qué tienes que decir? 😊" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Enviar Mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- ========== FOOTER (se inyecta con js/layout.js) ========== -->
  <footer id="footer"></footer>

  <!-- ========== MENÚ DEL SITIO (se inyecta con js/layout.js) ========== -->
  <div id="menu-root"></div>

  <!-- ========== SCRIPTS ========== -->
  <script src="js/theme.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/data-loader.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
